<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Location Form</title>
</head>
<body>
  <h1>Submit Your Location</h1>

  <!-- Form with data-netlify attribute -->
  <form name="location-form" method="POST" data-netlify="true">
    <label for="location">Enter Location:</label>
    <input type="text" id="location" name="location" required>
    <button type="submit">Submit</button>
  </form>

  <p>After submitting, you can view the data in the Netlify Dashboard under the Forms section.</p>
</body>
</html>
