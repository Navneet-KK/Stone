<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="chat.js"></script>
</head>
<body class="h-screen flex bg-gray-100">

    <!-- Left Sidebar -->
    <div class="w-1/4 bg-blue-600 text-white flex flex-col p-4">
        <!-- Current User -->
        <div class="text-lg font-bold mb-4">
            Connected: 
            <span id="username">User123</span>
            <span id="onlineStatus" class="text-gray-500">●</span>
        </div>
        <!-- Music Bot -->
        <div class="bg-blue-800 p-4 rounded-lg flex flex-col">
            <h3 class="text-white font-semibold">Music Bot</h3>
            <input type="text" id="songName" placeholder="Enter song name" class="mt-2 p-2 text-black rounded">
            <button class="mt-2 bg-white text-blue-700 px-4 py-2 rounded" onclick="playSong()">Play</button>
        </div>
    </div>

    <!-- Chat Section (Middle) -->
    <div class="flex-1 flex flex-col border-l border-r border-gray-300">
        <!-- Chat Display -->
        <div id="chat-box" class="flex-1 overflow-auto p-4 space-y-2">
            <div class="bg-gray-200 p-2 rounded">User1: Hello!</div>
            <div class="bg-blue-300 p-2 rounded self-end">You: Hi!</div>
        </div>
        <!-- Input Box -->
        <div class="flex items-center p-4 border-t border-gray-300 bg-white">
            <input id="message" type="text" placeholder="Type a message..." 
                class="flex-1 p-2 border rounded">
            <button id="sendButton" class="ml-2 bg-blue-600 text-white px-4 py-2 rounded">Send</button>
        </div>
    </div>

    <!-- Right Sidebar -->
    <div class="w-1/4 bg-gray-200 flex flex-col p-4">
        <button id="startCallButton" class="bg-green-500 text-white p-2 rounded mb-2" onclick="startVideoCall()">Start Voice Call</button>
        <button class="bg-blue-500 text-white p-2 rounded mb-2" onclick="startVideoCall()">Start Video Call</button>
        <button class="bg-red-500 text-white p-2 rounded" onclick="startScreenShare()">Start Screen Share</button>
    </div>

</body>
</html>
